<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义不同方向的白色小猫 -->
  <defs>
    <!-- 白色小猫1 -->
    <g id="white-cat1">
      <!-- 耳朵 -->
      <rect x="2" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="10" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="3" y="0" width="2" height="2" fill="#FFFFFF" />
      <rect x="10" y="0" width="2" height="2" fill="#FFFFFF" />
      
      <!-- 头部 -->
      <rect x="1" y="2" width="14" height="10" fill="#FFFFFF" />
      
      <!-- 眼睛 -->
      <rect x="3" y="5" width="2" height="2" fill="#000000" />
      <rect x="11" y="5" width="2" height="2" fill="#000000" />
      <rect x="4" y="4" width="1" height="1" fill="#FFFFFF" />
      <rect x="12" y="4" width="1" height="1" fill="#FFFFFF" />
      
      <!-- 鼻子 -->
      <rect x="7" y="7" width="2" height="2" fill="#FF69B4" />
      
      <!-- 嘴巴 -->
      <rect x="6" y="9" width="1" height="2" fill="#000000" />
      <rect x="9" y="9" width="1" height="2" fill="#000000" />
      <rect x="7" y="11" width="2" height="1" fill="#000000" />
      
      <!-- 胡须 -->
      <rect x="1" y="7" width="2" height="1" fill="#000000" />
      <rect x="1" y="9" width="2" height="1" fill="#000000" />
      <rect x="13" y="7" width="2" height="1" fill="#000000" />
      <rect x="13" y="9" width="2" height="1" fill="#000000" />
      
      <!-- 身体 -->
      <rect x="2" y="12" width="12" height="6" fill="#FFFFFF" />
      
      <!-- 爪子 -->
      <rect x="2" y="18" width="3" height="3" fill="#FFFFFF" />
      <rect x="11" y="18" width="3" height="3" fill="#FFFFFF" />
      
      <!-- 尾巴 -->
      <rect x="14" y="14" width="3" height="1" fill="#FFFFFF" />
      <rect x="17" y="15" width="3" height="1" fill="#FFFFFF" />
    </g>
    
    <!-- 白色小猫2 -->
    <g id="white-cat2">
      <!-- 耳朵 -->
      <rect x="2" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="10" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="3" y="0" width="2" height="2" fill="#FFFFFF" />
      <rect x="10" y="0" width="2" height="2" fill="#FFFFFF" />
      
      <!-- 头部 -->
      <rect x="1" y="2" width="14" height="10" fill="#FFFFFF" />
      
      <!-- 眼睛 -->
      <rect x="3" y="5" width="2" height="2" fill="#000000" />
      <rect x="11" y="5" width="2" height="2" fill="#000000" />
      <rect x="4" y="4" width="1" height="1" fill="#FFFFFF" />
      <rect x="12" y="4" width="1" height="1" fill="#FFFFFF" />
      
      <!-- 鼻子 -->
      <rect x="7" y="7" width="2" height="2" fill="#1E90FF" />
      
      <!-- 嘴巴 -->
      <rect x="6" y="9" width="1" height="2" fill="#000000" />
      <rect x="9" y="9" width="1" height="2" fill="#000000" />
      <rect x="7" y="11" width="2" height="1" fill="#000000" />
      
      <!-- 胡须 -->
      <rect x="1" y="7" width="2" height="1" fill="#000000" />
      <rect x="1" y="9" width="2" height="1" fill="#000000" />
      <rect x="13" y="7" width="2" height="1" fill="#000000" />
      <rect x="13" y="9" width="2" height="1" fill="#000000" />
      
      <!-- 身体 -->
      <rect x="2" y="12" width="12" height="6" fill="#FFFFFF" />
      
      <!-- 爪子 -->
      <rect x="2" y="18" width="3" height="3" fill="#FFFFFF" />
      <rect x="11" y="18" width="3" height="3" fill="#FFFFFF" />
      
      <!-- 尾巴 -->
      <rect x="0" y="14" width="1" height="3" fill="#FFFFFF" />
      <rect x="-1" y="17" width="1" height="1" fill="#FFFFFF" />
    </g>
    
    <!-- 白色小猫3 -->
    <g id="white-cat3">
      <!-- 耳朵 -->
      <rect x="2" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="10" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="3" y="0" width="2" height="2" fill="#FFFFFF" />
      <rect x="10" y="0" width="2" height="2" fill="#FFFFFF" />
      
      <!-- 头部 -->
      <rect x="1" y="2" width="14" height="10" fill="#FFFFFF" />
      
      <!-- 眼睛 -->
      <rect x="3" y="5" width="2" height="2" fill="#000000" />
      <rect x="11" y="5" width="2" height="2" fill="#000000" />
      <rect x="4" y="4" width="1" height="1" fill="#FFFFFF" />
      <rect x="12" y="4" width="1" height="1" fill="#FFFFFF" />
      
      <!-- 鼻子 -->
      <rect x="7" y="7" width="2" height="2" fill="#FFA500" />
      
      <!-- 嘴巴 -->
      <rect x="6" y="9" width="1" height="2" fill="#000000" />
      <rect x="9" y="9" width="1" height="2" fill="#000000" />
      <rect x="7" y="11" width="2" height="1" fill="#000000" />
      
      <!-- 胡须 -->
      <rect x="1" y="7" width="2" height="1" fill="#000000" />
      <rect x="1" y="9" width="2" height="1" fill="#000000" />
      <rect x="13" y="7" width="2" height="1" fill="#000000" />
      <rect x="13" y="9" width="2" height="1" fill="#000000" />
      
      <!-- 身体 -->
      <rect x="2" y="12" width="12" height="6" fill="#FFFFFF" />
      
      <!-- 爪子 -->
      <rect x="2" y="18" width="3" height="3" fill="#FFFFFF" />
      <rect x="11" y="18" width="3" height="3" fill="#FFFFFF" />
      
      <!-- 尾巴 - 卷曲 -->
      <rect x="14" y="14" width="2" height="1" fill="#FFFFFF" />
      <rect x="16" y="15" width="1" height="2" fill="#FFFFFF" />
      <rect x="15" y="17" width="2" height="1" fill="#FFFFFF" />
    </g>
    
    <!-- 白色小猫4 -->
    <g id="white-cat4">
      <!-- 耳朵 -->
      <rect x="2" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="10" y="1" width="4" height="4" fill="#FFFFFF" />
      <rect x="3" y="0" width="2" height="2" fill="#FFFFFF" />
      <rect x="10" y="0" width="2" height="2" fill="#FFFFFF" />
      
      <!-- 头部 -->
      <rect x="1" y="2" width="14" height="10" fill="#FFFFFF" />
      
      <!-- 眼睛 -->
      <rect x="3" y="5" width="2" height="2" fill="#000000" />
      <rect x="11" y="5" width="2" height="2" fill="#000000" />
      <rect x="4" y="4" width="1" height="1" fill="#FFFFFF" />
      <rect x="12" y="4" width="1" height="1" fill="#FFFFFF" />
      
      <!-- 鼻子 -->
      <rect x="7" y="7" width="2" height="2" fill="#32CD32" />
      
      <!-- 嘴巴 -->
      <rect x="6" y="9" width="1" height="2" fill="#000000" />
      <rect x="9" y="9" width="1" height="2" fill="#000000" />
      <rect x="7" y="11" width="2" height="1" fill="#000000" />
      
      <!-- 胡须 -->
      <rect x="1" y="7" width="2" height="1" fill="#000000" />
      <rect x="1" y="9" width="2" height="1" fill="#000000" />
      <rect x="13" y="7" width="2" height="1" fill="#000000" />
      <rect x="13" y="9" width="2" height="1" fill="#000000" />
      
      <!-- 身体 -->
      <rect x="2" y="12" width="12" height="6" fill="#FFFFFF" />
      
      <!-- 爪子 -->
      <rect x="2" y="18" width="3" height="3" fill="#FFFFFF" />
      <rect x="11" y="18" width="3" height="3" fill="#FFFFFF" />
      
      <!-- 尾巴 - 直立 -->
      <rect x="14" y="13" width="1" height="5" fill="#FFFFFF" />
    </g>
  </defs>
  
  <!-- 排列小猫形成网格 -->
  <!-- 第一行 -->
  <use href="#white-cat1" transform="translate(0, 0)" />
  <use href="#white-cat2" transform="translate(32, 0)" />
  <use href="#white-cat3" transform="translate(64, 0)" />
  <use href="#white-cat4" transform="translate(96, 0)" />
  
  <!-- 第二行 -->
  <use href="#white-cat2" transform="translate(16, 32)" />
  <use href="#white-cat3" transform="translate(48, 32)" />
  <use href="#white-cat4" transform="translate(80, 32)" />
  <use href="#white-cat1" transform="translate(112, 32)" />
  
  <!-- 第三行 -->
  <use href="#white-cat3" transform="translate(0, 64)" />
  <use href="#white-cat4" transform="translate(32, 64)" />
  <use href="#white-cat1" transform="translate(64, 64)" />
  <use href="#white-cat2" transform="translate(96, 64)" />
  
  <!-- 第四行 -->
  <use href="#white-cat4" transform="translate(16, 96)" />
  <use href="#white-cat1" transform="translate(48, 96)" />
  <use href="#white-cat2" transform="translate(80, 96)" />
  <use href="#white-cat3" transform="translate(112, 96)" />
</svg>